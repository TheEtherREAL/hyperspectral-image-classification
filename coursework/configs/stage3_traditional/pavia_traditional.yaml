experiment:
  name: pavia_traditional_feature_classifier_comparison
  seed: 1442
stage1_manifest: coursework/outputs/stage1/pavia_university/stage1_manifest.json
spatial_features:
  component_count: 3
  lbp_bins: 16
  pooling_window: 9
  gabor_orientations: [0.0, 45.0, 90.0, 135.0]
  gabor_frequencies: [0.1, 0.2]
  gabor_sigma: 2.5
  gabor_gamma: 0.5
  gabor_radius: 6
classifiers:
  svm:
    kernel: rbf
    C: 16.0
    gamma: scale
    cache_size_mb: 2048
  xgboost:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
    min_child_weight: 1.0
    reg_lambda: 1.0
    tree_method: hist
    n_jobs: -1
methods:
  PCA15_SVM:
    display_name: PCA15 + SVM
    features: spectral
    classifier: svm
  PCA15_XGBoost:
    display_name: PCA15 + XGBoost
    features: spectral
    classifier: xgboost
  PCA15_LBP_SVM:
    display_name: PCA15 + LBP + SVM
    features: spectral_lbp
    classifier: svm
  PCA15_Gabor_SVM:
    display_name: PCA15 + Gabor + SVM
    features: spectral_gabor
    classifier: svm
  PCA15_LBP_Gabor_SVM:
    display_name: PCA15 + LBP + Gabor + SVM
    features: spectral_lbp_gabor
    classifier: svm
  PCA15_LBP_Gabor_XGBoost:
    display_name: PCA15 + LBP + Gabor + XGBoost
    features: spectral_lbp_gabor
    classifier: xgboost

