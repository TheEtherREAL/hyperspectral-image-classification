experiment:
  name: indian_pines_stage1
  seed: 1442
dataset:
  name: indian_pines
  split_protocol: fair24_6_70
  split_seed: 1442
selected_route: pca15
save_model_ready_routes: [pca15]
routes:
  raw_all_bands: {standardization: standard, reducer: none}
  pca15: {standardization: standard, reducer: pca, n_components: 15, whiten: false}
  lda15: {standardization: standard, reducer: lda, n_components: 15}
  uniform15: {standardization: standard, reducer: band_selection, method: uniform, n_components: 15}
  fisher15: {standardization: standard, reducer: band_selection, method: fisher, n_components: 15}
spatial_preprocessing:
  representation: patch
  patch_size: 25
  padding_mode: constant
  padding_value: 0.0
output: {dtype: float32}

