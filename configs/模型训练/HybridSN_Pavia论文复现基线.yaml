# 统一随机种子配置：数据划分、模型初始化、训练与 DataLoader 均使用 1442
# Unified seed config: split, initialization, training and DataLoader all use 1442.
experiment:
  name: pavia_hybridsn_baseline
  seed: 1442
  output_root: experiments

dataset:
  name: pavia_university
  data_path: data/raw/PaviaU.mat
  label_path: data/raw/PaviaU_gt.mat
  background_label: 0
  split_protocol: paper30
  split_seed: 1442
  split_file: data/splits/pavia_university__paper30__seed1442.npz

spectral_preprocessing:
  standardization: standard
  reducer: pca  # 只改为 lda，即自动使用下面的 LDA8 参数
  pca:
    n_components: 15
    whiten: false
  lda:
    n_components: 8

spatial_preprocessing:
  representation: patch
  patch_size: 25
  padding_mode: constant
  padding_value: 0.0

output:
  dtype: float32

model:
  name: hybridsn
  dropout: 0.4
  num_classes: 9

training:
  optimizer: adam
  learning_rate: 0.001
  batch_size: 256
  epochs: 100
  weight_decay: 0.0
  checkpoint_every: 10
  augmentation: false
  batch_normalization: false
  checkpoint_metric: fixed_final_epoch

evaluation:
  metrics:
    - oa
    - aa
    - kappa
    - per_class_accuracy
  save_confusion_matrix: true
  save_loss_curve: true
  save_classification_map: true
  save_per_class_accuracy: true
  measure_training_time: true
  measure_inference_time: true
