# 日常默认路线：使用验证集进行公平调参 / Default fair-comparison route
dataset:
  name: pavia_university
  split_protocol: fair24_6_70
  split_seed: 1442

spectral_preprocessing:
  standardization: standard
  reducer: pca  # 只改为 lda，即自动使用下面的 LDA8 参数
  pca:
    n_components: 15
    whiten: false
  lda:
    n_components: 8

spatial_preprocessing:
  representation: patch
  patch_size: 25
  padding_mode: constant
  padding_value: 0.0

output:
  dtype: float32

dataloader:
  batch_size: 256
  loader_seed: 1442
  num_workers: 0
  pin_memory: true
