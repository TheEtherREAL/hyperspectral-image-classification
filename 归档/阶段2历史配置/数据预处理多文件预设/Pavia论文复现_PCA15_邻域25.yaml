# HybridSN 论文兼容数据路线：无验证集 / Paper-compatible route without validation
dataset:
  name: pavia_university
  split_protocol: paper30
  split_seed: 345

spectral_preprocessing:
  standardization: standard
  reducer: pca  # 只改为 lda，即自动使用下面的 LDA8 参数
  pca:
    n_components: 15
    whiten: false
  lda:
    n_components: 8

spatial_preprocessing:
  representation: patch
  patch_size: 25
  padding_mode: constant
  padding_value: 0.0

output:
  dtype: float32

dataloader:
  batch_size: 256
  loader_seed: 42
  num_workers: 0
  pin_memory: true
